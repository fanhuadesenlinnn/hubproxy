name: Security image release
on:
  push:
    branches: ['security-*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  release:
    if: github.repository == 'fanhuadesenlinnn/hubproxy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Security and regression tests
        working-directory: src
        run: |
          go test -race ./...
          go vet ./...
      - name: Compile
        run: |
          mkdir -p dist
          cd src
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.Version=1.2.5-security-${GITHUB_SHA:0:12}" -o "../dist/hubproxy-linux-$arch" .
          done
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/fanhuadesenlinnn/hubproxy:security-${{ github.sha }}
          build-args: GIT_COMMIT=${{ github.sha }}
